name: Run Dynatrace Synthetic Monitor

on:
  workflow_dispatch:

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest

    env:
      DT_ENV: https://srz47642.live.dynatrace.com
      DT_MONITOR_ID: ${{ vars.DT_MONITOR_ID }}
      DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}

    steps:
      - name: Validate variables
        run: |
          echo "Monitor ID: ${DT_MONITOR_ID}"

      - name: Trigger synthetic monitor
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${DT_ENV}/platform/synthetic/v1/monitors/${DT_MONITOR_ID}/execute" \
            --header "Authorization: Bearer ${DT_API_TOKEN}"

      - name: Success
        run: echo "Synthetic monitor triggered."
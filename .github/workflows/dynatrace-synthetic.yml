name: Run Dynatrace Synthetic Monitor

on:
  workflow_dispatch:

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest

    env:
      DT_ENV: https://srz47642.apps.dynatrace.com
      DT_MONITOR_ID: ${{ vars.DT_MONITOR_ID }}
      DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}

    steps:
      - name: Validate variables
        run: |
          echo "Monitor ID: ${DT_MONITOR_ID}"

      - name: Trigger Synthetic Monitor
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${DT_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"monitors\": [
                {
                  \"monitorId\": \"${DT_MONITOR_ID}\"
                }
              ]
            }" \
            "${DT_ENV}/platform/synthetic/v1/executions/batch"

      - name: Success
        run: echo "Synthetic monitor triggered."